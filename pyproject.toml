[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codenames-ai-arena"
version = "0.1.0"
description = "Local Codenames agents with explicit information boundaries"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.51,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1,<2",
    "openai>=2,<4",
    "anthropic>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tmp", ".playwright"]
